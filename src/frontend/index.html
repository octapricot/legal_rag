<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDPR Legal Research Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.01em; }
    header span { font-size: 0.8rem; opacity: 0.5; }

    .badge {
      background: #e8f0fe;
      color: #1a73e8;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      letter-spacing: 0.03em;
    }

    main { max-width: 860px; margin: 2.5rem auto; padding: 0 1.5rem; }

    .query-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.75rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      margin-bottom: 1.5rem;
    }

    .query-card label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #666;
      margin-bottom: 0.6rem;
    }

    textarea {
      width: 100%;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      min-height: 90px;
      transition: border-color 0.15s;
      color: #1a1a2e;
    }
    textarea:focus { outline: none; border-color: #1a73e8; }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    select {
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-size: 0.85rem;
      font-family: inherit;
      background: #fafafa;
      color: #333;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: #1a73e8; }

    .top-k-label { font-size: 0.8rem; color: #888; white-space: nowrap; }

    button#submit {
      margin-left: auto;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button#submit:hover { background: #1558b0; }
    button#submit:active { transform: scale(0.98); }
    button#submit:disabled { background: #a8c7fa; cursor: not-allowed; }

    /* Spinner */
    .spinner-wrap {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      padding: 2.5rem;
      color: #666;
      font-size: 0.9rem;
    }
    .spinner-wrap.active { display: flex; }
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid #e0e0e0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result */
    #result { display: none; }
    #result.active { display: block; }

    .sources-bar {
      background: #e8f0fe;
      border-radius: 10px;
      padding: 0.9rem 1.25rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: #1a56a0;
    }
    .sources-bar strong { font-weight: 700; }
    .sources-bar .source-tag {
      display: inline-block;
      background: #fff;
      border: 1px solid #b8d0f5;
      border-radius: 6px;
      padding: 0.15rem 0.55rem;
      margin: 0.2rem 0.2rem 0 0;
      font-size: 0.75rem;
    }

    .brief-card {
      background: #fff;
      border-radius: 12px;
      padding: 2rem 2.25rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      line-height: 1.7;
    }

    /* Markdown styles inside brief-card */
    .brief-card h1 { font-size: 1.35rem; margin-bottom: 1rem; color: #1a1a2e; }
    .brief-card h2 { font-size: 1.05rem; font-weight: 700; margin: 1.5rem 0 0.5rem; color: #1a1a2e; border-bottom: 1.5px solid #f0f0f0; padding-bottom: 0.3rem; }
    .brief-card h3 { font-size: 0.95rem; font-weight: 600; margin: 1rem 0 0.3rem; }
    .brief-card p { margin-bottom: 0.75rem; }
    .brief-card ul, .brief-card ol { padding-left: 1.4rem; margin-bottom: 0.75rem; }
    .brief-card li { margin-bottom: 0.3rem; }
    .brief-card blockquote {
      border-left: 3px solid #1a73e8;
      padding: 0.5rem 1rem;
      margin: 0.75rem 0;
      background: #f8fbff;
      color: #333;
      font-style: italic;
      border-radius: 0 6px 6px 0;
    }
    .brief-card table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
      font-size: 0.88rem;
    }
    .brief-card th {
      background: #f5f6fa;
      padding: 0.55rem 0.8rem;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #e0e0e0;
    }
    .brief-card td {
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid #f0f0f0;
    }
    .brief-card tr:last-child td { border-bottom: none; }
    .brief-card strong { font-weight: 600; }
    .brief-card code {
      background: #f0f4ff;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85em;
    }
    .brief-card details { margin: 0.5rem 0; }
    .brief-card summary { cursor: pointer; color: #666; font-size: 0.85rem; }

    /* Warnings */
    .warn-block {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: #7a5800;
    }
    .warn-block strong { font-weight: 700; }

    /* Retrieval metadata — collapsed by default */
    .meta-toggle {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid #f0f0f0;
    }
    .meta-toggle summary {
      cursor: pointer;
      font-size: 0.8rem;
      color: #999;
      user-select: none;
    }
    .meta-content {
      font-size: 0.78rem;
      color: #888;
      margin-top: 0.5rem;
      line-height: 1.6;
    }

    .error-card {
      background: #fff0f0;
      border: 1px solid #ffcdd2;
      border-radius: 10px;
      padding: 1.25rem;
      color: #b71c1c;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #aaa;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>

<header>
  <h1>⚖️ GDPR Legal Research Assistant</h1>
  <span class="badge">RAG · EDPB Guidelines · GDPR</span>
  <span>AI-generated briefs — not legal advice</span>
</header>

<main>
  <div class="query-card">
    <label for="query">Legal Query</label>
    <textarea
      id="query"
      placeholder="e.g. What are the conditions for lawful processing of personal data under GDPR?"
      autofocus
    ></textarea>

    <div class="controls">
      <select id="filter">
        <option value="">All sources</option>
        <option value="regulation">GDPR regulation only</option>
        <option value="guideline">EDPB guidelines only</option>
      </select>

      <span class="top-k-label">
        Max sources:
        <select id="topk">
          <option value="6">6</option>
          <option value="8" selected>8</option>
          <option value="12">12</option>
        </select>
      </span>

      <button id="submit">Generate Brief</button>
    </div>
  </div>

  <div class="spinner-wrap" id="spinner">
    <div class="spinner"></div>
    <span>Retrieving sources and generating brief…</span>
  </div>

  <div id="result">
    <div id="sources-bar" class="sources-bar" style="display:none"></div>
    <div id="warnings" class="warn-block" style="display:none"></div>
    <div id="brief" class="brief-card"></div>
  </div>
</main>

<footer>
  Legal RAG · GDPR + EDPB Guidelines · For research purposes only
</footer>

<script>
  const submitBtn = document.getElementById('submit');
  const spinner   = document.getElementById('spinner');
  const result    = document.getElementById('result');
  const briefEl   = document.getElementById('brief');
  const sourcesEl = document.getElementById('sources-bar');
  const warnEl    = document.getElementById('warnings');

  // Allow Cmd/Ctrl+Enter to submit
  document.getElementById('query').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submitBtn.click();
  });

  submitBtn.addEventListener('click', async () => {
    const query = document.getElementById('query').value.trim();
    if (!query) return;

    const filter = document.getElementById('filter').value || null;
    const topK   = parseInt(document.getElementById('topk').value);

    // UI: loading state
    submitBtn.disabled = true;
    spinner.classList.add('active');
    result.classList.remove('active');
    sourcesEl.style.display = 'none';
    warnEl.style.display = 'none';
    briefEl.innerHTML = '';

    try {
      const resp = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, top_k: topK, doc_type_filter: filter }),
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ detail: resp.statusText }));
        throw new Error(err.detail || 'Request failed');
      }

      const data = await resp.json();

      // Sources bar
      if (data.sources_used?.length) {
        const tags = data.sources_used
          .map(s => `<span class="source-tag">${s}</span>`)
          .join('');
        sourcesEl.innerHTML = `<strong>Sources used (${data.sources_used.length}):</strong><br>${tags}`;
        sourcesEl.style.display = 'block';
      }

      // Warnings
      if (data.warnings?.length) {
        warnEl.innerHTML = '<strong>⚠️ Validation warnings:</strong><br>' +
          data.warnings.map(w => `• ${w}`).join('<br>');
        warnEl.style.display = 'block';
      }

      // Render Markdown brief
      briefEl.innerHTML = marked.parse(data.brief_markdown || '');

      result.classList.add('active');

    } catch (err) {
      const msg = err.message.includes('404')
        ? 'No sufficiently relevant sources found. Try rephrasing using GDPR-specific terminology (e.g. "lawful basis", "data subject rights", "personal data breach").'
        : err.message;
      briefEl.innerHTML = `<div class="error-card"><strong>Error:</strong> ${msg}</div>`;
      result.classList.add('active');
    } finally {
      submitBtn.disabled = false;
      spinner.classList.remove('active');
    }
  });
</script>
</body>
</html>
